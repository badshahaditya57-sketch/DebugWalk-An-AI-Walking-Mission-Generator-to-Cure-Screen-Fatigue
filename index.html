<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebugWalk - Step Away from the Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen font-sans text-gray-800 flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-lg border border-green-100">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-green-700 mb-2">🌿 DebugWalk</h1>
            <p class="text-gray-500">Stuck on a bug? Screen fatigue? Time to touch grass.</p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="apiKey" class="block text-sm font-semibold text-gray-700 mb-2">Gemini API Key (Local Demo)</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label for="currentTask" class="block text-sm font-semibold text-gray-700 mb-2">What are you stuck on right now?</label>
                <input type="text" id="currentTask" placeholder="e.g., Cloud Firestore bugs, linear algebra..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <button id="generateBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                Generate My Outdoor Mission
            </button>
        </div>

        <div id="loading" class="hidden mt-6 text-center text-green-600 font-semibold animate-pulse">
            Mapping your tech-detox route...
        </div>

        <div id="resultContainer" class="hidden mt-8 p-6 bg-green-50 rounded-xl border border-green-200">
            <h2 class="text-xl font-bold text-green-800 mb-3">Your Mission: Leave the Phone Behind</h2>
            <div id="missionOutput" class="text-gray-700 whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const currentTask = document.getElementById('currentTask').value.trim();
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const missionOutput = document.getElementById('missionOutput');

            if (!apiKey || !currentTask) {
                alert("Please enter both your API key and what you are working on.");
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50');
            resultContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            const prompt = `I am a student currently stuck and burned out while working on: ${currentTask}. 
            I need to "touch grass". Give me a highly specific, 15-minute outdoor walking mission to clear my head. 
            Connect the outdoor activity metaphorically to what I am studying, but strictly require me to look at nature, not a screen. Keep it under 150 words and be encouraging.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                missionOutput.innerHTML = data.candidates[0].content.parts[0].text;
                resultContainer.classList.remove('hidden');
            } catch (error) {
                alert("Failed to generate mission. Check API key.");
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
